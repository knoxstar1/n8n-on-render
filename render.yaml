# Render Blueprint for n8n backed by Render Postgres.
# Secrets are never stored here: N8N_ENCRYPTION_KEY is generated by Render,
# and values marked `sync: false` must be entered in the Render dashboard.
services:
  - type: web
    name: n8n
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      # n8n listens on Render's PORT (Render sets PORT=10000 by default).
      - key: PORT
        value: "10000"
      - key: N8N_PORT
        value: "10000"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # Public URL settings: replace with your Render URL or custom domain.
      - key: N8N_HOST
        sync: false            # e.g. n8n-xxxx.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        sync: false            # e.g. https://n8n-xxxx.onrender.com/
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: GENERIC_TIMEZONE
        value: UTC
      # Database: Render Postgres (see `databases` below).
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

databases:
  - name: n8n-db
    databaseName: n8n
    user: n8n
    plan: basic-256mb
    ipAllowList: []            # only reachable from Render services
